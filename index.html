<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transcriber</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <main>
    <h1>Transcriber</h1>
    <p class="sub">Drop any video or audio file. Audio is extracted in your browser first, so huge files work.</p>

    <label class="drop" id="drop">
      <input type="file" id="file" accept="video/*,audio/*" hidden />
      <span id="fileLabel">Click or drop a file here</span>
    </label>

    <div class="row">
      <label>Language
        <select id="lang">
          <option value="">Auto-detect</option>
          <option value="en">English</option>
          <option value="hi">Hindi</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="ar">Arabic</option>
          <option value="ur">Urdu</option>
        </select>
      </label>
      <button id="go" disabled>Transcribe</button>
    </div>

    <div class="bar" id="barWrap" hidden><div id="bar"></div></div>
    <p id="status" class="status"></p>

    <textarea id="out" placeholder="Transcript will appear here…" readonly></textarea>
    <div class="row">
      <button id="copy" class="ghost" disabled>Copy</button>
      <button id="download" class="ghost" disabled>Download .txt</button>
    </div>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
